<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Sistemas de Informação Geográfica 1</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2eb;
    --surface: #fdfbf7;
    --ink: #1a1a18;
    --ink-muted: #6b6b60;
    --ink-faint: #b0af a5;
    --accent: #2d5a27;
    --accent-light: #e8f0e6;
    --accent-mid: #4a8c40;
    --wrong: #8b2a2a;
    --wrong-light: #f5e8e8;
    --correct: #2d5a27;
    --border: rgba(26,26,24,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
  }


  /* ── HERO (shared style) ── */
  .hero {
    background: linear-gradient(135deg, #1e3a8a 0%, #1a56db 100%);
    padding: 2.5rem 2rem 2rem;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: 'SIG';
    font-family: 'Syne', sans-serif;
    font-size: 180px;
    font-weight: 800;
    color: rgba(255,255,255,0.05);
    position: absolute;
    right: -20px;
    bottom: -40px;
    line-height: 1;
    pointer-events: none;
  }
  .hero-inner { max-width: 900px; margin: 0 auto; position: relative; }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 0.5rem;
  }
  .hero p {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
  }


  /* ── TABS ── */
  .tabs-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0;
    padding: 0 2rem;
    overflow-x: auto;
  }
  .tab-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 14px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--ink); }

  /* ── STATS BAR ── */
  .stats-bar {
    background: var(--surface);
    padding: 12px 2rem;
    display: flex;
    gap: 2rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .stat-dot.green { background: var(--accent-mid); }
  .stat-dot.red { background: #c0392b; }
  .stat-dot.gray { background: #bbb; }
  .stat span { font-size: 13px; color: var(--ink-muted); }
  .stat strong { color: var(--ink); }

  .progress-wrap { flex: 1; min-width: 180px; }
  .progress-label { font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; }
  .progress-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent-mid); border-radius: 999px; transition: width 0.4s ease; }

  .reset-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { color: var(--wrong); border-color: var(--wrong); }

  /* ── MAIN CONTENT ── */
  .main { max-width: 720px; margin: 0 auto; padding: 2rem; }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .q-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }

  .q-header {
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .q-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    background: var(--accent-light);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .q-text {
    font-size: 15px;
    line-height: 1.6;
    font-weight: 400;
    color: var(--ink);
  }

  .q-options { padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 8px; }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: none;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.5;
    transition: all 0.18s;
    position: relative;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent-mid);
    background: var(--accent-light);
  }
  .opt-btn:disabled { cursor: default; }

  .opt-letter {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    min-width: 20px;
    color: var(--ink-muted);
    padding-top: 1px;
    flex-shrink: 0;
  }

  /* States */
  .opt-btn.correct {
    background: #e8f4e6;
    border-color: var(--correct);
  }
  .opt-btn.correct .opt-letter { color: var(--correct); }
  .opt-btn.wrong {
    background: var(--wrong-light);
    border-color: var(--wrong);
  }
  .opt-btn.wrong .opt-letter { color: var(--wrong); }
  .opt-btn.dimmed {
    opacity: 0.45;
  }

  .opt-icon {
    margin-left: auto;
    font-size: 16px;
    flex-shrink: 0;
    padding-top: 1px;
  }

  /* Feedback */
  .q-feedback {
    padding: 10px 1.5rem 14px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .q-feedback.show { display: block; }
  .q-feedback.correct-fb { color: var(--correct); }
  .q-feedback.wrong-fb { color: var(--wrong); }
  .q-feedback strong { font-weight: 600; }

  /* ── RESULT CARD ── */
  .result-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .result-card.show { display: block; }
  .result-score {
    font-family: 'DM Serif Display', serif;
    font-size: 64px;
    color: var(--accent);
    line-height: 1;
  }
  .result-score span { font-size: 28px; color: var(--ink-muted); }
  .result-label { font-size: 14px; color: var(--ink-muted); margin-top: 8px; margin-bottom: 1.5rem; }
  .result-bar-wrap { background: var(--border); border-radius: 999px; height: 10px; overflow: hidden; max-width: 320px; margin: 0 auto 1.5rem; }
  .result-bar-fill { height: 100%; border-radius: 999px; background: var(--accent-mid); transition: width 1s ease; }
  .result-msg { font-size: 15px; color: var(--ink); margin-bottom: 1.5rem; line-height: 1.6; }
  .retry-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 28px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .retry-btn:hover { opacity: 0.85; }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--ink-muted);
  }

  /* ── ANIMATION ── */
  @keyframes popIn {
    from { transform: scale(0.97); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .q-card { animation: popIn 0.25s ease both; }
  .q-card:nth-child(1) { animation-delay: 0.02s; }
  .q-card:nth-child(2) { animation-delay: 0.05s; }
  .q-card:nth-child(3) { animation-delay: 0.08s; }
  .q-card:nth-child(4) { animation-delay: 0.11s; }
  .q-card:nth-child(5) { animation-delay: 0.14s; }
  .q-card:nth-child(6) { animation-delay: 0.17s; }
  .q-card:nth-child(7) { animation-delay: 0.20s; }
  .q-card:nth-child(8) { animation-delay: 0.23s; }
  .q-card:nth-child(9) { animation-delay: 0.26s; }
  .q-card:nth-child(10) { animation-delay: 0.29s; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <h1>Quiz — Sistemas de Informação Geográfica 1</h1>
    <p>Clique numa opção para responder</p>
  </div>
</div>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab(0)">Versão 1</button>
  <button class="tab-btn" onclick="switchTab(1)">Versão 2</button>
  <button class="tab-btn" onclick="switchTab(2)">Misto (20 perguntas)</button>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-dot green"></div><span>Certas: <strong id="cnt-correct">0</strong></span></div>
  <div class="stat"><div class="stat-dot red"></div><span>Erradas: <strong id="cnt-wrong">0</strong></span></div>
  <div class="stat"><div class="stat-dot gray"></div><span>Por responder: <strong id="cnt-pending">10</strong></span></div>
  <div class="progress-wrap">
    <div class="progress-label" id="progress-label">0 / 10 respondidas</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <button class="reset-btn" onclick="resetQuiz()">↺ Reiniciar</button>
</div>

<div class="main" id="quiz-main"></div>

<div class="footer">Quiz — Sistemas de Informação Geográfica 1</div>

<script>
const banks = [
  // ── VERSÃO 1 ──
  [
    {
      q: "Qual das seguintes definições descreve melhor um Sistema de Informação Geográfica (SIG)?",
      opts: [
        "Um sistema exclusivamente utilizado para criar mapas em papel a partir de dados topográficos.",
        "Um conjunto de ferramentas que permite recolher, armazenar, extrair, transformar e visualizar dados espaciais.",
        "Um software de edição de imagens de satélite sem capacidade de análise espacial.",
        "Uma base de dados alfanumérica que regista apenas atributos não espaciais de fenómenos geográficos."
      ],
      correct: 1,
      explain: "Um SIG é definido como um conjunto de ferramentas que permite recolher (georreferenciar), armazenar, extrair, transformar e visualizar dados espaciais."
    },
    {
      q: "No modelo de dados vectorial, qual das geometrias básicas é utilizada para representar entidades como rios ou estradas?",
      opts: ["Ponto", "Polígono", "Linha", "Pixel"],
      correct: 2,
      explain: "As linhas representam entidades lineares como rios, estradas ou linhas elétricas. Os pontos representam árvores ou cidades; os polígonos representam edifícios ou lagos."
    },
    {
      q: "Em cartografia, uma escala 1:25 000 significa que:",
      opts: [
        "1 cm no mapa equivale a 25 m na realidade.",
        "1 cm no mapa equivale a 25 000 cm (250 m) na realidade.",
        "O mapa tem maior pormenor do que um mapa à escala 1:1000.",
        "A escala é maior do que a escala 1:5000."
      ],
      correct: 1,
      explain: "1 cm no mapa = 25 000 cm = 250 m na realidade. Uma escala 1:1000 é de grande escala (maior detalhe), enquanto 1:25 000 é de pequena escala."
    },
    {
      q: "Qual das seguintes afirmações sobre dados raster é correta?",
      opts: [
        "Os dados raster têm alta precisão geométrica e estrutura de dados complexa.",
        "Os dados raster organizam o espaço em células regulares e são ideais para representar fenómenos contínuos como a elevação ou temperatura.",
        "Os dados raster são independentes da resolução espacial e mantêm qualidade ao ampliar.",
        "Os dados raster são sempre superiores aos dados vectoriais para análise de redes."
      ],
      correct: 1,
      explain: "Os dados raster organizam o espaço em células regulares (pixels), sendo ideais para fenómenos contínuos como elevação, temperatura ou imagens de satélite."
    },
    {
      q: "O Elipsóide, em geodesia, é definido como:",
      opts: [
        "A superfície real e irregular da Terra incluindo o relevo topográfico.",
        "Uma superfície matemática que melhor se aproxima do geóide e serve de base para o estabelecimento de coordenadas geográficas.",
        "A superfície definida pelo nível médio dos oceanos, influenciada pela gravidade.",
        "Um sistema de projeção cartográfica utilizado exclusivamente em Portugal."
      ],
      correct: 1,
      explain: "O elipsóide é uma superfície matemática de referência que melhor se aproxima do geóide, sendo a base para o estabelecimento das coordenadas geográficas."
    },
    {
      q: "Qual é o código EPSG do sistema de referência oficial de Portugal Continental atualmente adotado (ETRS89 / PT-TM06)?",
      opts: ["EPSG: 4326", "EPSG: 27493", "EPSG: 3763", "EPSG: 3857"],
      correct: 2,
      explain: "O EPSG 3763 corresponde ao sistema ETRS89 / PT-TM06, o sistema de referência oficial de Portugal Continental. O EPSG 4326 é o WGS84 global e o 3857 é o usado pelo Google Maps."
    },
    {
      q: "O geoprocessamento em SIG permite, entre outras operações:",
      opts: [
        "Apenas visualizar dados espaciais sem efetuar qualquer análise.",
        "Executar operações como buffer, intersecção, união e dissolve para determinar relações entre dados espaciais.",
        "Converter imagens de satélite em formato de texto simples.",
        "Substituir completamente a recolha de dados no campo."
      ],
      correct: 1,
      explain: "O geoprocessamento permite operações como buffer, intersecções, dissolve, join e union, que caracterizam e determinam relações entre dados espaciais."
    },
    {
      q: "Qual das seguintes opções representa um tipo de base de dados espacial?",
      opts: ["Microsoft Word", "PostGIS", "Adobe Illustrator", "Google Docs"],
      correct: 1,
      explain: "O PostGIS é uma extensão espacial do PostgreSQL. Outros exemplos de bases de dados espaciais incluem GeoPackage, SpatialLite, Oracle Spatial e Geodatabase."
    },
    {
      q: "Em cartografia, quais são os cinco elementos essenciais que um mapa deve conter?",
      opts: [
        "Título, orientação, escala, legenda e fonte.",
        "Título, latitude, longitude, altitude e projeção.",
        "Legenda, datum, elipsóide, geóide e meridiano.",
        "Escala, pixels, resolução, RGB e datum."
      ],
      correct: 0,
      explain: "Um mapa deve sempre conter: Título, Orientação, Escala, Legenda e Fonte. Estes são os cinco elementos essenciais para a sua correta interpretação."
    },
    {
      q: "No contexto da Proteção Civil, os SIG são utilizados principalmente para:",
      opts: [
        "Produção exclusiva de arte cartográfica para fins decorativos.",
        "Planeamento, gestão de crises, cálculo de rotas, análise de vulnerabilidades e apoio à decisão em situações de risco.",
        "Substituir todos os sistemas de comunicação de emergência existentes.",
        "Gerir exclusivamente bases de dados administrativas sem componente espacial."
      ],
      correct: 1,
      explain: "Os SIG são fundamentais na Proteção Civil para planear, inventariar, calcular rotas, identificar áreas de risco e apoiar a tomada de decisão em situações de emergência."
    }
  ],

  // ── VERSÃO 2 ──
  [
    {
      q: "A Cartografia é definida como:",
      opts: [
        "Um sistema de informação que armazena apenas dados alfanuméricos sobre o território.",
        "A ciência que trata da conceção, produção, utilização e estudo documental dos mapas.",
        "Um software utilizado exclusivamente para criação de bases de dados espaciais.",
        "O processo de recolha de dados GPS em trabalho de campo."
      ],
      correct: 1,
      explain: "A Cartografia é a ciência que trata da conceção, produção, utilização e estudo documental dos mapas."
    },
    {
      q: "Uma carta temática tem como principal objetivo:",
      opts: [
        "Representar a topografia da superfície terrestre com o maior rigor possível.",
        "Cobrir sistematicamente um país ou região com informação geográfica genérica.",
        "Representar informação geográfica sobre um assunto específico, de forma qualitativa ou quantitativa.",
        "Mostrar exclusivamente informação sobre oceanos, lagos e rios."
      ],
      correct: 2,
      explain: "A carta temática representa informação geográfica sobre um assunto específico (o tema), sob forma qualitativa ou quantitativa, sobre um fundo de informação geral simplificado."
    },
    {
      q: "Qual das seguintes afirmações descreve corretamente o Geóide?",
      opts: [
        "Uma superfície matemática regular utilizada como base para as coordenadas geográficas.",
        "Uma superfície equipotencial que coincide aproximadamente com o nível médio das águas do mar e que mais se aproxima da forma real da Terra.",
        "A superfície topográfica real com todo o relevo da Terra.",
        "Um sistema de projeção cilíndrica utilizado na cartografia de Portugal."
      ],
      correct: 1,
      explain: "O Geóide é uma superfície equipotencial cuja normal coincide com a vertical do lugar, coincidindo aproximadamente com o nível médio das águas do mar. É considerado a 'superfície zero'."
    },
    {
      q: "Nas coordenadas geográficas, a Latitude corresponde ao eixo:",
      opts: ["X (Este-Oeste)", "Z (altitude)", "Y (Norte-Sul)", "W (profundidade)"],
      correct: 2,
      explain: "A Latitude corresponde ao eixo Y (Norte-Sul) e a Longitude ao eixo X (Este-Oeste). Latitude mede o ângulo em relação ao equador; Longitude em relação ao meridiano de Greenwich."
    },
    {
      q: "Qual das seguintes opções corresponde a um método primário de aquisição de dados para SIG?",
      opts: [
        "Digitalização de mapas existentes",
        "Vectorização automática de cartografia já publicada",
        "Levantamento de campo com GPS",
        "Utilização de dados estatísticos do INE"
      ],
      correct: 2,
      explain: "Os métodos primários implicam aquisição de dados diretamente do objeto — como levantamentos de campo com GPS. Os métodos secundários utilizam fontes pré-existentes (digitalização, dados estatísticos)."
    },
    {
      q: "O QGIS é um software SIG que se caracteriza por ser:",
      opts: [
        "Proprietário, de licença paga, disponível apenas para Windows.",
        "De código aberto (open source), gratuito e multiplataforma (Windows, Mac, Linux).",
        "Um serviço exclusivamente online sem possibilidade de instalação local.",
        "Desenvolvido pela ESRI como alternativa ao ArcGIS."
      ],
      correct: 1,
      explain: "O QGIS foi iniciado em 2002 por Gary Sherman como projeto de software livre e open source. É gratuito, multiplataforma e mantido por uma comunidade global de programadores."
    },
    {
      q: "Qual é o código EPSG correto para o sistema de referência utilizado na ilha da Madeira (ITRF93 / PTRA08 - UTM zona 28N)?",
      opts: ["EPSG: 4326", "EPSG: 3763", "EPSG: 5016", "EPSG: 27493"],
      correct: 2,
      explain: "O EPSG 5016 corresponde ao sistema ITRF93 / PTRA08 - UTM zona 28N, utilizado na Madeira, Porto Santo, Desertas e Selvagens."
    },
    {
      q: "Num SIG, uma ligação WFS distingue-se de uma ligação WMS porque:",
      opts: [
        "O WFS serve apenas imagens raster, enquanto o WMS serve dados vectoriais.",
        "O WFS permite gravar dados remotamente, enquanto o WMS é apenas de leitura.",
        "O WFS é um serviço exclusivo do QGIS, enquanto o WMS é da ESRI.",
        "Não existe qualquer diferença funcional entre os dois serviços."
      ],
      correct: 1,
      explain: "O WMS é de leitura (visualização de mapas como imagem); o WCS é de leitura com verificação de atributos; o WFS permite gravar dados remotamente."
    },
    {
      q: "Comparando dados raster e vectoriais, qual das seguintes afirmações é correta?",
      opts: [
        "Os dados raster têm estrutura de dados mais complexa e menor tamanho de armazenamento.",
        "Os dados vectoriais apresentam maior precisão geométrica, estrutura de dados mais complexa e menor tamanho de armazenamento do que o raster.",
        "Os dados raster são sempre superiores para representar edifícios e parcelas territoriais.",
        "Os dados vectoriais têm resolução espacial variável consoante o tamanho do pixel."
      ],
      correct: 1,
      explain: "Os vectoriais têm maior precisão geométrica, estrutura mais complexa e menor armazenamento. O raster tem estrutura simples, maior armazenamento e é dependente da resolução."
    },
    {
      q: "Os marcos geodésicos que constituem a rede geodésica têm como função:",
      opts: [
        "Delimitar as fronteiras administrativas de um país.",
        "Marcar pontos de interesse turístico no território.",
        "Fornecer coordenadas geográficas com a maior exactidão possível, criando uma malha triangular que permite realizar projeções cartográficas.",
        "Registar dados meteorológicos para modelação climática."
      ],
      correct: 2,
      explain: "Os marcos geodésicos, colocados em topos de colinas ou sobre depósitos de água, fornecem coordenadas geográficas com grande exactidão e criam uma malha triangular que permite projeções cartográficas."
    }
  ]
];

let currentTab = 0;
let state = {};

function getQuestions() {
  if (currentTab === 0) return banks[0];
  if (currentTab === 1) return banks[1];
  // Mixed: interleave both
  const mixed = [];
  for (let i = 0; i < 10; i++) {
    mixed.push({ ...banks[0][i], _src: 'V1 Q' + (i + 1) });
    mixed.push({ ...banks[1][i], _src: 'V2 Q' + (i + 1) });
  }
  return mixed;
}

function initState(questions) {
  state = {};
  questions.forEach((_, i) => { state[i] = null; });
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  renderQuiz();
}

function renderQuiz() {
  const questions = getQuestions();
  initState(questions);
  updateStats(questions);

  const container = document.getElementById('quiz-main');
  container.innerHTML = '';

  // Result card (hidden initially)
  const rc = document.createElement('div');
  rc.className = 'result-card';
  rc.id = 'result-card';
  rc.innerHTML = `
    <div class="result-score" id="result-score">0 <span>/ ${questions.length}</span></div>
    <div class="result-label" id="result-label">respostas corretas</div>
    <div class="result-bar-wrap"><div class="result-bar-fill" id="result-bar" style="width:0%"></div></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="retry-btn" onclick="resetQuiz()">Tentar novamente</button>
  `;
  container.appendChild(rc);

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + qi;

    const srcBadge = q._src ? ` &nbsp;·&nbsp; ${q._src}` : '';
    card.innerHTML = `
      <div class="q-header">
        <span class="q-badge">Q ${qi + 1}${srcBadge}</span>
        <span class="q-text">${q.q}</span>
      </div>
      <div class="q-options" id="opts-${qi}">
        ${q.opts.map((o, oi) => `
          <button class="opt-btn" id="opt-${qi}-${oi}" onclick="answer(${qi}, ${oi})">
            <span class="opt-letter">${String.fromCharCode(65 + oi)})</span>
            <span>${o}</span>
            <span class="opt-icon" id="icon-${qi}-${oi}"></span>
          </button>
        `).join('')}
      </div>
      <div class="q-feedback" id="fb-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function answer(qi, oi) {
  if (state[qi] !== null) return; // already answered
  const questions = getQuestions();
  const q = questions[qi];
  state[qi] = oi;

  const correct = oi === q.correct;

  // Style buttons
  q.opts.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    const icon = document.getElementById(`icon-${qi}-${i}`);
    btn.disabled = true;
    if (i === q.correct) {
      btn.classList.add('correct');
      icon.textContent = '✓';
    } else if (i === oi && !correct) {
      btn.classList.add('wrong');
      icon.textContent = '✗';
    } else {
      btn.classList.add('dimmed');
    }
  });

  // Feedback
  const fb = document.getElementById(`fb-${qi}`);
  fb.className = 'q-feedback show ' + (correct ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<strong>${correct ? '✓ Correto!' : '✗ Incorreto.'}</strong> ${q.explain}`;

  updateStats(questions);
  checkFinished(questions);
}

function updateStats(questions) {
  const total = questions.length;
  const answered = Object.values(state).filter(v => v !== null).length;
  const correct = questions.reduce((acc, q, i) => acc + (state[i] === q.correct ? 1 : 0), 0);
  const wrong = answered - correct;
  const pending = total - answered;

  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
  document.getElementById('cnt-pending').textContent = pending;
  document.getElementById('progress-label').textContent = `${answered} / ${total} respondidas`;
  document.getElementById('progress-fill').style.width = (answered / total * 100) + '%';
}

function checkFinished(questions) {
  const total = questions.length;
  const answered = Object.values(state).filter(v => v !== null).length;
  if (answered < total) return;

  const correct = questions.reduce((acc, q, i) => acc + (state[i] === q.correct ? 1 : 0), 0);
  const pct = Math.round(correct / total * 100);

  const rc = document.getElementById('result-card');
  rc.classList.add('show');
  document.getElementById('result-score').innerHTML = `${correct} <span>/ ${total}</span>`;
  document.getElementById('result-bar').style.width = pct + '%';

  let msg = '';
  if (pct >= 90) msg = '🏆 Excelente! Dominas muito bem os conteúdos de SIG.';
  else if (pct >= 70) msg = '👍 Bom resultado! Revê os temas onde erraste para consolidar o conhecimento.';
  else if (pct >= 50) msg = '📖 Resultado razoável. Recomenda-se uma revisão mais aprofundada dos conteúdos.';
  else msg = '📚 Precisas de estudar mais. Volta a rever os slides e tenta novamente.';

  document.getElementById('result-msg').textContent = msg;
  rc.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
renderQuiz();
</script>
</body>
